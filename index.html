<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon correcto -->
    <link rel="icon" type="image/png" href="/img/Logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitnoriosGYM</title>
    <meta name="google" content="notranslate">

    <!-- SEO -->
    <meta name="description" content="FitnoriosGYM - Tienda fitness de productos deportivos, mancuernas, barras, ropa deportiva y más.">

    <!-- OpenGraph (Facebook, Instagram, WhatsApp) -->
    <meta property="og:title" content="FitnoriosGYM">
    <meta property="og:description" content="Compra productos fitness de alta calidad al mejor precio.">
    <meta property="og:image" content="https://www.fitnoriosgym.com/img/og-cover.jpg">
    <meta property="og:image:alt" content="Logo de FitnoriosGYM - Tienda fitness">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1600">
    <meta property="og:image:height" content="900">
    <meta property="og:url" content="https://www.fitnoriosgym.com">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FitnoriosGYM">
    <meta property="og:locale" content="es_CO">

    <!-- Vista previa al compartir (Telegram, Twitter/X) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://www.fitnoriosgym.com/img/og-cover.jpg">

    <!-- Para evitar bloqueos en iPhone / Instagram WebView -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Para mejorar la vista en iOS / Safari -->
    <link rel="apple-touch-icon" href="/img/Logo.png" />
  </head>
